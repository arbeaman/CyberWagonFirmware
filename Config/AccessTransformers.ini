Friend=(Class="AFGWheeledVehicle", FriendClass="FCWFU_SteeringPatch")
Friend=(Class="UFGWheeledVehicleMovementComponent", FriendClass="FCWFU_SteeringPatch")
; Runtime setup copies icons/categories/unlock objects from the vanilla Cyber Wagon content
Friend=(Class="UFGItemDescriptor", FriendClass="UCWFU_WorldSubsystem")
Friend=(Class="UFGRecipe", FriendClass="UCWFU_WorldSubsystem")
Friend=(Class="UFGSchematic", FriendClass="UCWFU_WorldSubsystem")
Friend=(Class="UFGSchematicPurchasedDependency", FriendClass="UCWFU_WorldSubsystem")
Friend=(Class="UFGUnlockRecipe", FriendClass="UCWFU_WorldSubsystem")
; Cargo upgrade sets and reads the storage slot count
Friend=(Class="AFGWheeledVehicle", FriendClass="UCWFU_WorldSubsystem")
Friend=(Class="AFGWheeledVehicle", FriendClass="FCWFU_TuningPatch")
